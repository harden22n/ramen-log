<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラーメン記録 案B かわいい</title>
<style>
  body{margin:0;background:#fff6e5;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;color:#5a3d2b}
  .wrap{max-width:420px;margin:0 auto;padding:16px}
  h1{text-align:center;font-size:22px;margin:6px 0 14px}
  .search{width:100%;box-sizing:border-box;padding:12px 16px;font-size:16px;border:2px solid #f3c77a;border-radius:24px;background:#fff;color:#5a3d2b}
  .big{display:block;width:100%;margin:16px 0 8px;padding:18px;border:none;border-radius:24px;background:#ffb347;color:#fff;font-size:18px;font-weight:700;box-shadow:0 4px 0 #e8962a}
  .near{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
  .n{background:#fff;border-radius:18px;padding:10px 6px;text-align:center;font-size:13px;box-shadow:0 2px 6px rgba(200,140,60,.15)}
  .n b{display:block;font-size:24px}
  .n small{color:#b08a6a}
  h2{font-size:14px;margin:8px 4px}
  .card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(200,140,60,.15)}
  .bowl{width:44px;height:44px;border-radius:50%;background:#ffe2b0;display:grid;place-items:center;font-size:24px}
  .name{font-weight:700}
  .sub{font-size:12px;color:#b08a6a}
  .star{margin-left:auto;color:#ff9f1c;font-size:13px}
</style></head><body><div class="wrap">
  <h1>🍜 ラーメンにっき</h1>
  <input class="search" placeholder="🔍 店名でさがす">
  <button class="big">ここで食べた！</button>
  <div class="near">
    <div class="n"><b>🍥</b>麺屋 さくら<br><small>50m</small></div>
    <div class="n"><b>🍜</b>らーめん 北斗<br><small>120m</small></div>
    <div class="n"><b>🌶️</b>味噌の大将<br><small>300m</small></div>
  </div>
  <h2>いったお店</h2>
  <div class="card"><div class="bowl">🍥</div><div><div class="name">麺屋 さくら</div><div class="sub">10/28・味噌チャーシュー・3回目</div></div><div class="star">★★★★</div></div>
  <div class="card"><div class="bowl">🍜</div><div><div class="name">らーめん 北斗</div><div class="sub">10/12・醤油・1回目</div></div><div class="star">★★★</div></div>
  <div class="card"><div class="bowl">🌶️</div><div><div class="name">味噌の大将</div><div class="sub">9/30・辛味噌・2回目</div></div><div class="star">★★★★★</div></div>
</div></body></html>
