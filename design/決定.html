<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ラーメン記録 案C 情報多め</title>
<style>
  body{margin:0;background:#f4efe6;font-family:"Yu Mincho","Hiragino Mincho ProN",serif;color:#2b2420}
  .noren{background:#1f3a5f;color:#fff;padding:14px 16px 18px;position:relative}
  .noren h1{margin:0;font-size:22px;letter-spacing:.2em}
  .noren p{margin:4px 0 0;font-size:12px;opacity:.8;font-family:system-ui,sans-serif}
  .noren:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:repeating-linear-gradient(90deg,#1f3a5f 0 22%,transparent 22% 25%)}
  .wrap{max-width:420px;margin:0 auto;padding:20px 14px;font-family:system-ui,"Yu Gothic",sans-serif}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .s{background:#fff;border-radius:6px;padding:8px;text-align:center;font-size:11px;color:#7a6a5a}
  .s b{display:block;font-size:20px;color:#c0392b}
  .search{width:100%;box-sizing:border-box;padding:10px 12px;font-size:16px;border:1px solid #cdbfa8;border-radius:6px;background:#fff}
  h2{font-size:12px;color:#7a6a5a;margin:16px 0 6px;border-left:3px solid #c0392b;padding-left:6px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  td{padding:9px 6px;border-bottom:1px solid #eee4d4}
  .go{background:#c0392b;color:#fff;border:none;border-radius:4px;padding:6px 10px;font-size:13px}
  .dist{color:#9a8a7a;font-size:11px}
  .num{text-align:right;color:#c0392b;font-weight:700}
</style></head><body>
  <div class="noren"><h1>拉麺帖</h1><p>行った店を、店名ですぐ引ける</p></div>
  <div class="wrap">
    <div class="stats"><div class="s"><b>24</b>今年の杯数</div><div class="s"><b>11</b>行った店</div><div class="s"><b>3</b>今月</div></div>
    <input class="search" placeholder="店名で探す">
    <h2>近くの店</h2>
    <table>
      <tr><td>麺屋 さくら <span class="dist">50m・3回</span></td><td style="text-align:right"><button class="go">行った</button></td></tr>
      <tr><td>らーめん 北斗 <span class="dist">120m・1回</span></td><td style="text-align:right"><button class="go">行った</button></td></tr>
      <tr><td>味噌の大将 <span class="dist">300m・未訪問</span></td><td style="text-align:right"><button class="go">行った</button></td></tr>
    </table>
    <h2>行った店（回数順）</h2>
    <table>
      <tr><td>麺屋 さくら<br><span class="dist">最後 10/28・味噌チャーシュー・★4</span></td><td class="num">3回</td></tr>
      <tr><td>味噌の大将<br><span class="dist">最後 9/30・辛味噌・★5</span></td><td class="num">2回</td></tr>
      <tr><td>らーめん 北斗<br><span class="dist">最後 10/12・醤油・★3</span></td><td class="num">1回</td></tr>
      <tr><td>中華そば 白石<br><span class="dist">最後 9/14</span></td><td class="num">1回</td></tr>
    </table>
  </div>
</body></html>
